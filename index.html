<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikan's Corner — welcome</title>
<meta name="description" content="A tiny home for Mikan, a pixel cat drawn entirely with canvas fillRects. Three pages, zero images.">
<meta property="og:title" content="Mikan's Corner">
<meta property="og:description" content="A tiny home for a small orange cat who lives in my computer.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='19' r='11' fill='%23f7a354'/%3E%3Cellipse cx='21' cy='7' rx='5' ry='3' fill='%235f9b3a'/%3E%3Crect x='10' y='16' width='3' height='3' fill='%233d2b26'/%3E%3Crect x='19' y='16' width='3' height='3' fill='%233d2b26'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="chopsticks">
  <span class="logo">🍊 Mikan's Corner</span>
  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <button class="theme-toggle" type="button">☀️</button>
  </nav>
</header>

<main class="lid" id="main">
  <div class="hero">
    <canvas id="cat" width="220" height="260" tabindex="0" role="button"
            aria-label="Mikan the cat — click or press Enter to pet her"></canvas>
    <h1>Welcome to Mikan's Corner</h1>
    <p class="sub">A tiny home for a small orange cat who lives in my computer.</p>
    <div class="feed-row">
      <button id="feed" class="btn btn-small" type="button">🍊 Give her a mikan</button>
      <span id="treats" class="treats" aria-live="polite"></span>
    </div>
    <a class="btn" href="gallery.html">Come in →</a>
  </div>
  <p class="hint">psst — click her (or press enter). she likes that.</p>
</main>

<footer>made with canvas fillRects &amp; too much love · page 1 of 3</footer>

<script src="cat.js"></script>
<script>
(function () {
  var c = document.getElementById('cat');
  var TREAT_KEY = 'mikan-treats';
  var treats = 0;
  try { treats = parseInt(localStorage.getItem(TREAT_KEY) || '0', 10) || 0; } catch (e) {}

  function renderTreats() {
    var el = document.getElementById('treats');
    el.innerHTML = treats === 0
      ? 'no snacks shared yet'
      : '<strong>' + treats + '</strong> snack' + (treats === 1 ? '' : 's') + ' shared';
  }
  renderTreats();

  var busy = false;
  function react(opts, ms) {
    if (busy) return;
    busy = true;
    drawMikan(c, Object.assign({ pose: 'sit' }, opts));
    setTimeout(function () { busy = false; }, ms);
  }

  function pet() { react({ blush: true, hearts: true }, 900); }
  c.addEventListener('click', pet);
  c.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pet(); }
  });

  document.getElementById('feed').addEventListener('click', function () {
    treats += 1;
    try { localStorage.setItem(TREAT_KEY, String(treats)); } catch (e) {}
    renderTreats();
    react({ mikan: true, hearts: true, blush: true }, 1200);
  });

  /* idle animation: tail wags now and then; pauses in hidden tabs */
  var t = 0;
  window.mikanEvery(130, function () {
    if (busy) return;
    t++;
    drawMikan(c, { pose: 'sit', wag: Math.sin(t / 9) > 0.3 });
  });
})();
</script>
</body>
</html>
